AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates a self-managed Apache Kafka cluster (3 brokers on 3 EC2 instances, KRaft mode)
  configured for SASL/OAUTHBEARER authentication against an Amazon Cognito User Pool,
  plus a 4th "client" EC2 instance pre-loaded with Java, Maven, Docker, the AWS CLI and
  the AWS SAM CLI so that the accompanying Lambda pattern can be built, deployed and tested.

Parameters:
  AdminUsername:
    Type: String
    Description: Cognito username for the Kafka ADMIN client (super user - may create topics and manage ACLs).
    Default: kafka-admin
    MinLength: 1
  ProducerUsername:
    Type: String
    Description: Cognito username for the Kafka PRODUCER client (authorized to WRITE to topics only).
    Default: kafka-producer
    MinLength: 1
  ConsumerUsername:
    Type: String
    Description: Cognito username for the Kafka CONSUMER client (authorized to READ from topics only).
    Default: kafka-consumer
    MinLength: 1
  LatestAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64'
  JavaVersion:
    Type: String
    Description: Choose the version of Java for the Lambda function. Lambda supports Java 11, 17, 21 and 25.
    AllowedValues:
      - java11
      - java17
      - java21
      - java25
    Default: java21
  ApacheKafkaInstallerLocation:
    Type: String
    Description: Download URL for the Apache Kafka distribution (Scala 2.13 build).
    Default: https://archive.apache.org/dist/kafka/3.9.0/kafka_2.13-3.9.0.tgz
  StrimziOAuthVersion:
    Type: String
    Description: Version of the Strimzi kafka-oauth libraries used for SASL/OAUTHBEARER on the brokers and client.
    Default: 0.15.0
  NimbusJoseJwtVersion:
    Type: String
    Description: Version of the nimbus-jose-jwt library (transitive dependency of the Strimzi OAuth libraries).
    Default: 9.37.3
  KafkaClusterId:
    Type: String
    Description: >
      Shared KRaft cluster ID (base64-encoded UUID). Must be identical on all three brokers.
      Generate your own with 'kafka-storage.sh random-uuid' or keep the default.
    Default: 4L6g3nShT-eMCtK--X86sw
  KafkaTopicForLambda:
    Type: String
    Default: KafkaOAuthJavaLambdaTopic
  ServerlessLandGithubLocation:
    Type: String
    Default: https://github.com/aws-samples/serverless-patterns/

Mappings:
  SubnetConfig:
    VPC:
      CIDR: '10.0.0.0/16'
    PublicOne:
      CIDR: '10.0.0.0/24'
    PrivateSubnetOne:
      CIDR: '10.0.1.0/24'
    PrivateSubnetTwo:
      CIDR: '10.0.2.0/24'
    PrivateSubnetThree:
      CIDR: '10.0.3.0/24'
  BrokerConfig:
    Broker1:
      PrivateIp: '10.0.1.10'
      NodeId: '1'
    Broker2:
      PrivateIp: '10.0.2.10'
      NodeId: '2'
    Broker3:
      PrivateIp: '10.0.3.10'
      NodeId: '3'

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      EnableDnsSupport: true
      EnableDnsHostnames: true
      CidrBlock: !FindInMap ['SubnetConfig', 'VPC', 'CIDR']
      Tags:
        - Key: 'Name'
          Value: 'KafkaOAuthVPC'

  PublicSubnetOne:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs: {Ref: 'AWS::Region'}
      VpcId: !Ref 'VPC'
      CidrBlock: !FindInMap ['SubnetConfig', 'PublicOne', 'CIDR']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: 'Name'
          Value: 'PublicSubnet'
  PrivateSubnetOne:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs: {Ref: 'AWS::Region'}
      VpcId: !Ref 'VPC'
      CidrBlock: !FindInMap ['SubnetConfig', 'PrivateSubnetOne', 'CIDR']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: 'Name'
          Value: 'PrivateSubnetOne'
  PrivateSubnetTwo:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone:
        Fn::Select:
          - 1
          - Fn::GetAZs: {Ref: 'AWS::Region'}
      VpcId: !Ref 'VPC'
      CidrBlock: !FindInMap ['SubnetConfig', 'PrivateSubnetTwo', 'CIDR']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: 'Name'
          Value: 'PrivateSubnetTwo'
  PrivateSubnetThree:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone:
        Fn::Select:
          - 2
          - Fn::GetAZs: {Ref: 'AWS::Region'}
      VpcId: !Ref 'VPC'
      CidrBlock: !FindInMap ['SubnetConfig', 'PrivateSubnetThree', 'CIDR']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: 'Name'
          Value: 'PrivateSubnetThree'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachement:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref 'VPC'
      InternetGatewayId: !Ref 'InternetGateway'

  NATEIP:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachement
    Properties:
      Domain: vpc

  NATGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NATEIP.AllocationId
      SubnetId: !Ref 'PublicSubnetOne'
      Tags:
        - Key: 'Name'
          Value: 'KafkaOAuthNATGateway'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref 'VPC'
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachement
    Properties:
      RouteTableId: !Ref 'PublicRouteTable'
      DestinationCidrBlock: '0.0.0.0/0'
      GatewayId: !Ref 'InternetGateway'
  PublicSubnetOneRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetOne
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref 'VPC'
  PrivateRoute:
    Type: AWS::EC2::Route
    DependsOn: NATGateway
    Properties:
      RouteTableId: !Ref 'PrivateRouteTable'
      DestinationCidrBlock: '0.0.0.0/0'
      NatGatewayId: !Ref 'NATGateway'
  PrivateSubnetOneRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnetOne
  PrivateSubnetTwoRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnetTwo
  PrivateSubnetThreeRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnetThree

  # ---- Cognito User Pool used as the OAuth 2.0 identity provider ----
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-kafka-oauth-pool"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AWS::StackName}-kafka-client"
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 1
      TokenValidityUnits:
        AccessToken: hours

  # ---- Generated passwords for the three role users (kept in Secrets Manager,
  #      never passed as CloudFormation parameters). The template stores a JSON
  #      { "username": ..., "password": ... } for each role. ----
  AdminUserSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}-kafka-admin-credentials"
      Description: Cognito credentials for the Kafka admin client
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username": "${AdminUsername}"}'
        GenerateStringKey: password
        PasswordLength: 20
        RequireEachIncludedType: true
        ExcludePunctuation: true

  ProducerUserSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}-kafka-producer-credentials"
      Description: Cognito credentials for the Kafka producer client
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username": "${ProducerUsername}"}'
        GenerateStringKey: password
        PasswordLength: 20
        RequireEachIncludedType: true
        ExcludePunctuation: true

  ConsumerUserSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}-kafka-consumer-credentials"
      Description: Cognito credentials for the Kafka consumer client
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username": "${ConsumerUsername}"}'
        GenerateStringKey: password
        PasswordLength: 20
        RequireEachIncludedType: true
        ExcludePunctuation: true

  CognitoAdminUser:
    Type: AWS::Cognito::UserPoolUser
    Properties:
      UserPoolId: !Ref CognitoUserPool
      Username: !Ref AdminUsername
      MessageAction: SUPPRESS

  CognitoProducerUser:
    Type: AWS::Cognito::UserPoolUser
    Properties:
      UserPoolId: !Ref CognitoUserPool
      Username: !Ref ProducerUsername
      MessageAction: SUPPRESS

  CognitoConsumerUser:
    Type: AWS::Cognito::UserPoolUser
    Properties:
      UserPoolId: !Ref CognitoUserPool
      Username: !Ref ConsumerUsername
      MessageAction: SUPPRESS

  # ---- Security Groups ----
  KafkaBrokerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the self-managed Kafka brokers
      GroupName: !Sub "${AWS::StackName}-kafka-broker-sg"
      VpcId: !Ref VPC
      SecurityGroupIngress:
        # Kafka client (9092), controller (9093) and inter-broker (9094) traffic
        # from anywhere inside the VPC (brokers, client instance and Lambda ENIs).
        - IpProtocol: tcp
          FromPort: 9092
          ToPort: 9094
          CidrIp: !FindInMap ['SubnetConfig', 'VPC', 'CIDR']
        # SSH from within the VPC (used by EC2 Instance Connect endpoint)
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !FindInMap ['SubnetConfig', 'VPC', 'CIDR']

  KafkaClientInstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the Kafka client / SAM deployment EC2 instance
      GroupName: !Sub "${AWS::StackName}-kafka-client-sg"
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !FindInMap ['SubnetConfig', 'VPC', 'CIDR']

  # ---- IAM role / instance profile for the EC2 instances ----
  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: 'sts:AssumeRole'
      Path: "/"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSCloudFormationFullAccess
        - arn:aws:iam::aws:policy/CloudWatchFullAccess
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/IAMFullAccess
        - arn:aws:iam::aws:policy/AWSLambda_FullAccess
        - arn:aws:iam::aws:policy/AmazonEC2FullAccess
      Policies:
        - PolicyName: CognitoAccess
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - 'cognito-idp:InitiateAuth'
                  - 'cognito-idp:AdminInitiateAuth'
                  - 'cognito-idp:AdminSetUserPassword'
                  - 'cognito-idp:AdminGetUser'
                  - 'cognito-idp:DescribeUserPool'
                  - 'cognito-idp:DescribeUserPoolClient'
                Resource: '*'
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - 'secretsmanager:GetSecretValue'
                  - 'secretsmanager:DescribeSecret'
                Resource:
                  - !Ref AdminUserSecret
                  - !Ref ProducerUserSecret
                  - !Ref ConsumerUserSecret

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Join ['-', ['EC2KafkaOAuthProfile', !Ref 'AWS::StackName']]
      Roles:
        - !Ref EC2Role

  # ---- Kafka broker EC2 instances (KRaft mode, SASL/OAUTHBEARER) ----
  KafkaBroker1:
    Type: AWS::EC2::Instance
    DependsOn: PrivateRoute
    Properties:
      InstanceType: m5.large
      IamInstanceProfile: !Ref EC2InstanceProfile
      SubnetId: !Ref PrivateSubnetOne
      PrivateIpAddress: !FindInMap ['BrokerConfig', 'Broker1', 'PrivateIp']
      SecurityGroupIds: [!GetAtt KafkaBrokerSecurityGroup.GroupId]
      ImageId: !Ref LatestAmiId
      Tags:
        - Key: 'Name'
          Value: 'KafkaBroker1'
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 50
            VolumeType: gp3
            DeleteOnTermination: true
      UserData:
        Fn::Base64:
          Fn::Sub:
            - |
              #!/bin/bash -xe
              exec > /var/log/kafka-broker-setup.log 2>&1

              NODE_ID=${node_id}
              BROKER_IP=${broker_ip}
              QUORUM_VOTERS=${quorum_voters}
              REGION=${region}
              USER_POOL_ID=${user_pool_id}
              KAFKA_URL=${kafka_installer}
              STRIMZI_VERSION=${strimzi_version}
              NIMBUS_VERSION=${nimbus_version}
              KAFKA_CLUSTER_ID=${kafka_cluster_id}
              ADMIN_USERNAME=${admin_username}

              install_pkg() {
                for i in 1 2 3 4 5; do
                  yum install -y "$@" && return 0
                  echo "yum install $* failed, retry $i"; sleep 5
                done
                return 1
              }
              yum update -y
              install_pkg java-17-amazon-corretto-headless wget tar

              cd /home/ec2-user
              KAFKA_TGZ=$(basename "$KAFKA_URL")
              KAFKA_DIR=$(basename "$KAFKA_TGZ" .tgz)
              for attempt in 1 2 3 4 5 6; do
                wget --timeout=60 --read-timeout=120 --tries=2 -O "$KAFKA_TGZ" "$KAFKA_URL" && test -s "$KAFKA_TGZ" && break
                echo "Kafka download attempt $attempt failed; retrying in 20s..."; sleep 20
              done
              test -s "$KAFKA_TGZ" || { echo "FATAL: unable to download Kafka from $KAFKA_URL"; exit 1; }
              tar -xzf "$KAFKA_TGZ"
              ln -sfn /home/ec2-user/$KAFKA_DIR /home/ec2-user/kafka

              cd /home/ec2-user/kafka/libs
              MVN=https://repo1.maven.org/maven2
              wget -q $MVN/io/strimzi/kafka-oauth-common/$STRIMZI_VERSION/kafka-oauth-common-$STRIMZI_VERSION.jar
              wget -q $MVN/io/strimzi/kafka-oauth-server/$STRIMZI_VERSION/kafka-oauth-server-$STRIMZI_VERSION.jar
              wget -q $MVN/io/strimzi/kafka-oauth-server-plain/$STRIMZI_VERSION/kafka-oauth-server-plain-$STRIMZI_VERSION.jar
              wget -q $MVN/io/strimzi/kafka-oauth-client/$STRIMZI_VERSION/kafka-oauth-client-$STRIMZI_VERSION.jar
              wget -q $MVN/com/nimbusds/nimbus-jose-jwt/$NIMBUS_VERSION/nimbus-jose-jwt-$NIMBUS_VERSION.jar

              ISSUER="https://cognito-idp.$REGION.amazonaws.com/$USER_POOL_ID"
              JWKS="$ISSUER/.well-known/jwks.json"

              cd /home/ec2-user/kafka
              cat > config/kraft-oauth.properties <<EOF
              process.roles=broker,controller
              node.id=$NODE_ID
              controller.quorum.voters=$QUORUM_VOTERS
              listeners=CLIENT://$BROKER_IP:9092,CONTROLLER://$BROKER_IP:9093,INTERNAL://$BROKER_IP:9094
              advertised.listeners=CLIENT://$BROKER_IP:9092,INTERNAL://$BROKER_IP:9094
              listener.security.protocol.map=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,CLIENT:SASL_PLAINTEXT
              controller.listener.names=CONTROLLER
              inter.broker.listener.name=INTERNAL
              sasl.enabled.mechanisms=OAUTHBEARER
              listener.name.client.sasl.enabled.mechanisms=OAUTHBEARER
              listener.name.client.oauthbearer.sasl.server.callback.handler.class=io.strimzi.kafka.oauth.server.JaasServerOauthValidatorCallbackHandler
              listener.name.client.oauthbearer.sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required oauth.jwks.endpoint.uri="$JWKS" oauth.valid.issuer.uri="$ISSUER" oauth.username.claim="username" unsecuredLoginStringClaim_sub="kafka-broker" ;
              authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
              allow.everyone.if.no.acl.found=false
              super.users=User:ANONYMOUS;User:$ADMIN_USERNAME
              num.partitions=3
              offsets.topic.replication.factor=3
              transaction.state.log.replication.factor=3
              transaction.state.log.min.isr=2
              default.replication.factor=3
              min.insync.replicas=2
              auto.create.topics.enable=true
              log.dirs=/home/ec2-user/kraft-combined-logs
              EOF

              /home/ec2-user/kafka/bin/kafka-storage.sh format -t "$KAFKA_CLUSTER_ID" -c /home/ec2-user/kafka/config/kraft-oauth.properties --ignore-formatted

              chown -R ec2-user:ec2-user /home/ec2-user

              cat > /etc/systemd/system/kafka.service <<EOF
              [Unit]
              Description=Apache Kafka (KRaft) broker
              After=network-online.target
              Wants=network-online.target
              [Service]
              Type=simple
              User=root
              Environment="KAFKA_HEAP_OPTS=-Xmx2G -Xms2G"
              ExecStart=/home/ec2-user/kafka/bin/kafka-server-start.sh /home/ec2-user/kafka/config/kraft-oauth.properties
              Restart=on-failure
              RestartSec=10
              [Install]
              WantedBy=multi-user.target
              EOF

              systemctl daemon-reload
              systemctl enable kafka
              systemctl start kafka
            - node_id: !FindInMap ['BrokerConfig', 'Broker1', 'NodeId']
              broker_ip: !FindInMap ['BrokerConfig', 'Broker1', 'PrivateIp']
              quorum_voters: !Sub
                - "1@${b1}:9093,2@${b2}:9093,3@${b3}:9093"
                - b1: !FindInMap ['BrokerConfig', 'Broker1', 'PrivateIp']
                  b2: !FindInMap ['BrokerConfig', 'Broker2', 'PrivateIp']
                  b3: !FindInMap ['BrokerConfig', 'Broker3', 'PrivateIp']
              region: !Ref 'AWS::Region'
              user_pool_id: !Ref CognitoUserPool
              kafka_installer: !Ref ApacheKafkaInstallerLocation
              strimzi_version: !Ref StrimziOAuthVersion
              nimbus_version: !Ref NimbusJoseJwtVersion
              kafka_cluster_id: !Ref KafkaClusterId
              admin_username: !Ref AdminUsername

  KafkaBroker2:
    Type: AWS::EC2::Instance
    DependsOn: PrivateRoute
    Properties:
      InstanceType: m5.large
      IamInstanceProfile: !Ref EC2InstanceProfile
      SubnetId: !Ref PrivateSubnetTwo
      PrivateIpAddress: !FindInMap ['BrokerConfig', 'Broker2', 'PrivateIp']
      SecurityGroupIds: [!GetAtt KafkaBrokerSecurityGroup.GroupId]
      ImageId: !Ref LatestAmiId
      Tags:
        - Key: 'Name'
          Value: 'KafkaBroker2'
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 50
            VolumeType: gp3
            DeleteOnTermination: true
      UserData:
        Fn::Base64:
          Fn::Sub:
            - |
              #!/bin/bash -xe
              exec > /var/log/kafka-broker-setup.log 2>&1

              NODE_ID=${node_id}
              BROKER_IP=${broker_ip}
              QUORUM_VOTERS=${quorum_voters}
              REGION=${region}
              USER_POOL_ID=${user_pool_id}
              KAFKA_URL=${kafka_installer}
              STRIMZI_VERSION=${strimzi_version}
              NIMBUS_VERSION=${nimbus_version}
              KAFKA_CLUSTER_ID=${kafka_cluster_id}
              ADMIN_USERNAME=${admin_username}

              install_pkg() {
                for i in 1 2 3 4 5; do
                  yum install -y "$@" && return 0
                  echo "yum install $* failed, retry $i"; sleep 5
                done
                return 1
              }
              yum update -y
              install_pkg java-17-amazon-corretto-headless wget tar

              cd /home/ec2-user
              KAFKA_TGZ=$(basename "$KAFKA_URL")
              KAFKA_DIR=$(basename "$KAFKA_TGZ" .tgz)
              for attempt in 1 2 3 4 5 6; do
                wget --timeout=60 --read-timeout=120 --tries=2 -O "$KAFKA_TGZ" "$KAFKA_URL" && test -s "$KAFKA_TGZ" && break
                echo "Kafka download attempt $attempt failed; retrying in 20s..."; sleep 20
              done
              test -s "$KAFKA_TGZ" || { echo "FATAL: unable to download Kafka from $KAFKA_URL"; exit 1; }
              tar -xzf "$KAFKA_TGZ"
              ln -sfn /home/ec2-user/$KAFKA_DIR /home/ec2-user/kafka

              cd /home/ec2-user/kafka/libs
              MVN=https://repo1.maven.org/maven2
              wget -q $MVN/io/strimzi/kafka-oauth-common/$STRIMZI_VERSION/kafka-oauth-common-$STRIMZI_VERSION.jar
              wget -q $MVN/io/strimzi/kafka-oauth-server/$STRIMZI_VERSION/kafka-oauth-server-$STRIMZI_VERSION.jar
              wget -q $MVN/io/strimzi/kafka-oauth-server-plain/$STRIMZI_VERSION/kafka-oauth-server-plain-$STRIMZI_VERSION.jar
              wget -q $MVN/io/strimzi/kafka-oauth-client/$STRIMZI_VERSION/kafka-oauth-client-$STRIMZI_VERSION.jar
              wget -q $MVN/com/nimbusds/nimbus-jose-jwt/$NIMBUS_VERSION/nimbus-jose-jwt-$NIMBUS_VERSION.jar

              ISSUER="https://cognito-idp.$REGION.amazonaws.com/$USER_POOL_ID"
              JWKS="$ISSUER/.well-known/jwks.json"

              cd /home/ec2-user/kafka
              cat > config/kraft-oauth.properties <<EOF
              process.roles=broker,controller
              node.id=$NODE_ID
              controller.quorum.voters=$QUORUM_VOTERS
              listeners=CLIENT://$BROKER_IP:9092,CONTROLLER://$BROKER_IP:9093,INTERNAL://$BROKER_IP:9094
              advertised.listeners=CLIENT://$BROKER_IP:9092,INTERNAL://$BROKER_IP:9094
              listener.security.protocol.map=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,CLIENT:SASL_PLAINTEXT
              controller.listener.names=CONTROLLER
              inter.broker.listener.name=INTERNAL
              sasl.enabled.mechanisms=OAUTHBEARER
              listener.name.client.sasl.enabled.mechanisms=OAUTHBEARER
              listener.name.client.oauthbearer.sasl.server.callback.handler.class=io.strimzi.kafka.oauth.server.JaasServerOauthValidatorCallbackHandler
              listener.name.client.oauthbearer.sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required oauth.jwks.endpoint.uri="$JWKS" oauth.valid.issuer.uri="$ISSUER" oauth.username.claim="username" unsecuredLoginStringClaim_sub="kafka-broker" ;
              authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
              allow.everyone.if.no.acl.found=false
              super.users=User:ANONYMOUS;User:$ADMIN_USERNAME
              num.partitions=3
              offsets.topic.replication.factor=3
              transaction.state.log.replication.factor=3
              transaction.state.log.min.isr=2
              default.replication.factor=3
              min.insync.replicas=2
              auto.create.topics.enable=true
              log.dirs=/home/ec2-user/kraft-combined-logs
              EOF

              /home/ec2-user/kafka/bin/kafka-storage.sh format -t "$KAFKA_CLUSTER_ID" -c /home/ec2-user/kafka/config/kraft-oauth.properties --ignore-formatted

              chown -R ec2-user:ec2-user /home/ec2-user

              cat > /etc/systemd/system/kafka.service <<EOF
              [Unit]
              Description=Apache Kafka (KRaft) broker
              After=network-online.target
              Wants=network-online.target
              [Service]
              Type=simple
              User=root
              Environment="KAFKA_HEAP_OPTS=-Xmx2G -Xms2G"
              ExecStart=/home/ec2-user/kafka/bin/kafka-server-start.sh /home/ec2-user/kafka/config/kraft-oauth.properties
              Restart=on-failure
              RestartSec=10
              [Install]
              WantedBy=multi-user.target
              EOF

              systemctl daemon-reload
              systemctl enable kafka
              systemctl start kafka
            - node_id: !FindInMap ['BrokerConfig', 'Broker2', 'NodeId']
              broker_ip: !FindInMap ['BrokerConfig', 'Broker2', 'PrivateIp']
              quorum_voters: !Sub
                - "1@${b1}:9093,2@${b2}:9093,3@${b3}:9093"
                - b1: !FindInMap ['BrokerConfig', 'Broker1', 'PrivateIp']
                  b2: !FindInMap ['BrokerConfig', 'Broker2', 'PrivateIp']
                  b3: !FindInMap ['BrokerConfig', 'Broker3', 'PrivateIp']
              region: !Ref 'AWS::Region'
              user_pool_id: !Ref CognitoUserPool
              kafka_installer: !Ref ApacheKafkaInstallerLocation
              strimzi_version: !Ref StrimziOAuthVersion
              nimbus_version: !Ref NimbusJoseJwtVersion
              kafka_cluster_id: !Ref KafkaClusterId
              admin_username: !Ref AdminUsername

  KafkaBroker3:
    Type: AWS::EC2::Instance
    DependsOn: PrivateRoute
    Properties:
      InstanceType: m5.large
      IamInstanceProfile: !Ref EC2InstanceProfile
      SubnetId: !Ref PrivateSubnetThree
      PrivateIpAddress: !FindInMap ['BrokerConfig', 'Broker3', 'PrivateIp']
      SecurityGroupIds: [!GetAtt KafkaBrokerSecurityGroup.GroupId]
      ImageId: !Ref LatestAmiId
      Tags:
        - Key: 'Name'
          Value: 'KafkaBroker3'
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 50
            VolumeType: gp3
            DeleteOnTermination: true
      UserData:
        Fn::Base64:
          Fn::Sub:
            - |
              #!/bin/bash -xe
              exec > /var/log/kafka-broker-setup.log 2>&1

              NODE_ID=${node_id}
              BROKER_IP=${broker_ip}
              QUORUM_VOTERS=${quorum_voters}
              REGION=${region}
              USER_POOL_ID=${user_pool_id}
              KAFKA_URL=${kafka_installer}
              STRIMZI_VERSION=${strimzi_version}
              NIMBUS_VERSION=${nimbus_version}
              KAFKA_CLUSTER_ID=${kafka_cluster_id}
              ADMIN_USERNAME=${admin_username}

              install_pkg() {
                for i in 1 2 3 4 5; do
                  yum install -y "$@" && return 0
                  echo "yum install $* failed, retry $i"; sleep 5
                done
                return 1
              }
              yum update -y
              install_pkg java-17-amazon-corretto-headless wget tar

              cd /home/ec2-user
              KAFKA_TGZ=$(basename "$KAFKA_URL")
              KAFKA_DIR=$(basename "$KAFKA_TGZ" .tgz)
              for attempt in 1 2 3 4 5 6; do
                wget --timeout=60 --read-timeout=120 --tries=2 -O "$KAFKA_TGZ" "$KAFKA_URL" && test -s "$KAFKA_TGZ" && break
                echo "Kafka download attempt $attempt failed; retrying in 20s..."; sleep 20
              done
              test -s "$KAFKA_TGZ" || { echo "FATAL: unable to download Kafka from $KAFKA_URL"; exit 1; }
              tar -xzf "$KAFKA_TGZ"
              ln -sfn /home/ec2-user/$KAFKA_DIR /home/ec2-user/kafka

              cd /home/ec2-user/kafka/libs
              MVN=https://repo1.maven.org/maven2
              wget -q $MVN/io/strimzi/kafka-oauth-common/$STRIMZI_VERSION/kafka-oauth-common-$STRIMZI_VERSION.jar
              wget -q $MVN/io/strimzi/kafka-oauth-server/$STRIMZI_VERSION/kafka-oauth-server-$STRIMZI_VERSION.jar
              wget -q $MVN/io/strimzi/kafka-oauth-server-plain/$STRIMZI_VERSION/kafka-oauth-server-plain-$STRIMZI_VERSION.jar
              wget -q $MVN/io/strimzi/kafka-oauth-client/$STRIMZI_VERSION/kafka-oauth-client-$STRIMZI_VERSION.jar
              wget -q $MVN/com/nimbusds/nimbus-jose-jwt/$NIMBUS_VERSION/nimbus-jose-jwt-$NIMBUS_VERSION.jar

              ISSUER="https://cognito-idp.$REGION.amazonaws.com/$USER_POOL_ID"
              JWKS="$ISSUER/.well-known/jwks.json"

              cd /home/ec2-user/kafka
              cat > config/kraft-oauth.properties <<EOF
              process.roles=broker,controller
              node.id=$NODE_ID
              controller.quorum.voters=$QUORUM_VOTERS
              listeners=CLIENT://$BROKER_IP:9092,CONTROLLER://$BROKER_IP:9093,INTERNAL://$BROKER_IP:9094
              advertised.listeners=CLIENT://$BROKER_IP:9092,INTERNAL://$BROKER_IP:9094
              listener.security.protocol.map=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,CLIENT:SASL_PLAINTEXT
              controller.listener.names=CONTROLLER
              inter.broker.listener.name=INTERNAL
              sasl.enabled.mechanisms=OAUTHBEARER
              listener.name.client.sasl.enabled.mechanisms=OAUTHBEARER
              listener.name.client.oauthbearer.sasl.server.callback.handler.class=io.strimzi.kafka.oauth.server.JaasServerOauthValidatorCallbackHandler
              listener.name.client.oauthbearer.sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required oauth.jwks.endpoint.uri="$JWKS" oauth.valid.issuer.uri="$ISSUER" oauth.username.claim="username" unsecuredLoginStringClaim_sub="kafka-broker" ;
              authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
              allow.everyone.if.no.acl.found=false
              super.users=User:ANONYMOUS;User:$ADMIN_USERNAME
              num.partitions=3
              offsets.topic.replication.factor=3
              transaction.state.log.replication.factor=3
              transaction.state.log.min.isr=2
              default.replication.factor=3
              min.insync.replicas=2
              auto.create.topics.enable=true
              log.dirs=/home/ec2-user/kraft-combined-logs
              EOF

              /home/ec2-user/kafka/bin/kafka-storage.sh format -t "$KAFKA_CLUSTER_ID" -c /home/ec2-user/kafka/config/kraft-oauth.properties --ignore-formatted

              chown -R ec2-user:ec2-user /home/ec2-user

              cat > /etc/systemd/system/kafka.service <<EOF
              [Unit]
              Description=Apache Kafka (KRaft) broker
              After=network-online.target
              Wants=network-online.target
              [Service]
              Type=simple
              User=root
              Environment="KAFKA_HEAP_OPTS=-Xmx2G -Xms2G"
              ExecStart=/home/ec2-user/kafka/bin/kafka-server-start.sh /home/ec2-user/kafka/config/kraft-oauth.properties
              Restart=on-failure
              RestartSec=10
              [Install]
              WantedBy=multi-user.target
              EOF

              systemctl daemon-reload
              systemctl enable kafka
              systemctl start kafka
            - node_id: !FindInMap ['BrokerConfig', 'Broker3', 'NodeId']
              broker_ip: !FindInMap ['BrokerConfig', 'Broker3', 'PrivateIp']
              quorum_voters: !Sub
                - "1@${b1}:9093,2@${b2}:9093,3@${b3}:9093"
                - b1: !FindInMap ['BrokerConfig', 'Broker1', 'PrivateIp']
                  b2: !FindInMap ['BrokerConfig', 'Broker2', 'PrivateIp']
                  b3: !FindInMap ['BrokerConfig', 'Broker3', 'PrivateIp']
              region: !Ref 'AWS::Region'
              user_pool_id: !Ref CognitoUserPool
              kafka_installer: !Ref ApacheKafkaInstallerLocation
              strimzi_version: !Ref StrimziOAuthVersion
              nimbus_version: !Ref NimbusJoseJwtVersion
              kafka_cluster_id: !Ref KafkaClusterId
              admin_username: !Ref AdminUsername

  KafkaClientEC2Instance:
    Type: AWS::EC2::Instance
    DependsOn:
      - KafkaBroker1
      - KafkaBroker2
      - KafkaBroker3
      - CognitoAdminUser
      - CognitoProducerUser
      - CognitoConsumerUser
      - AdminUserSecret
      - ProducerUserSecret
      - ConsumerUserSecret
    Properties:
      InstanceType: m5.large
      IamInstanceProfile: !Ref EC2InstanceProfile
      SubnetId: !Ref PublicSubnetOne
      SecurityGroupIds: [!GetAtt KafkaClientInstanceSecurityGroup.GroupId]
      ImageId: !Ref LatestAmiId
      Tags:
        - Key: 'Name'
          Value: 'KafkaClientInstance'
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 50
            VolumeType: gp3
            DeleteOnTermination: true
      UserData:
        Fn::Base64:
          Fn::Sub:
            - |
              #!/bin/bash -xe
              exec > /var/log/kafka-client-setup.log 2>&1

              JAVA_VERSION=${java_version}
              AWS_REGION=${region}
              KAFKA_URL=${kafka_installer}
              STRIMZI_VERSION=${strimzi_version}
              NIMBUS_VERSION=${nimbus_version}
              BOOTSTRAP_SERVERS=${bootstrap_servers}
              KAFKA_TOPIC=${kafka_topic}
              USER_POOL_ID=${user_pool_id}
              APP_CLIENT_ID=${app_client_id}
              ADMIN_USERNAME=${admin_username}
              PRODUCER_USERNAME=${producer_username}
              CONSUMER_USERNAME=${consumer_username}
              ADMIN_SECRET_NAME=${admin_secret}
              PRODUCER_SECRET_NAME=${producer_secret}
              CONSUMER_SECRET_NAME=${consumer_secret}
              SUBNET1=${subnet1}
              SUBNET2=${subnet2}
              SUBNET3=${subnet3}
              LAMBDA_SG=${lambda_sg}
              SERVERLESS_LAND_GITHUB_LOCATION=${serverless_land_github_location}
              KAFKA_HOME=/home/ec2-user/kafka
              KAFKA_JSON_APPS_JAR=/home/ec2-user/kafka-json-apps.jar

              install_pkg() {
                for i in 1 2 3 4 5; do
                  yum install -y "$@" && return 0
                  echo "yum install $* failed, retry $i"; sleep 5
                done
                return 1
              }
              yum update -y

              case "$JAVA_VERSION" in
                java11) install_pkg java-11-amazon-corretto-devel ;;
                java17) install_pkg java-17-amazon-corretto-devel ;;
                java21) install_pkg java-21-amazon-corretto-devel ;;
                java25) install_pkg java-25-amazon-corretto-devel ;;
                *) install_pkg java-21-amazon-corretto-devel ;;
              esac
              install_pkg git jq nmap-ncat wget tar unzip
              yum erase awscli -y || true
              install_pkg docker
              service docker start
              usermod -a -G docker ec2-user

              wget -q https://repos.fedorapeople.org/repos/dchen/apache-maven/epel-apache-maven.repo -O /etc/yum.repos.d/epel-apache-maven.repo
              sed -i s/\$releasever/6/g /etc/yum.repos.d/epel-apache-maven.repo
              install_pkg apache-maven || yum install -y maven || true

              # AWS CLI v2
              cd /home/ec2-user
              curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
              unzip -q awscliv2.zip
              ./aws/install || ./aws/install --update

              # AWS SAM CLI
              cd /home/ec2-user
              mkdir -p awssam && cd awssam
              wget -q https://github.com/aws/aws-sam-cli/releases/latest/download/aws-sam-cli-linux-x86_64.zip
              unzip -q aws-sam-cli-linux-x86_64.zip -d sam-installation
              ./sam-installation/install || ./sam-installation/install --update

              # Kafka CLI tools + Strimzi client OAuth libraries
              cd /home/ec2-user
              KAFKA_TGZ=$(basename "$KAFKA_URL")
              KAFKA_DIR=$(basename "$KAFKA_TGZ" .tgz)
              for attempt in 1 2 3 4 5 6; do
                wget --timeout=60 --read-timeout=120 --tries=2 -O "$KAFKA_TGZ" "$KAFKA_URL" && test -s "$KAFKA_TGZ" && break
                echo "Kafka download attempt $attempt failed; retrying in 20s..."; sleep 20
              done
              test -s "$KAFKA_TGZ" || { echo "FATAL: unable to download Kafka from $KAFKA_URL"; exit 1; }
              tar -xzf "$KAFKA_TGZ"
              ln -sfn /home/ec2-user/$KAFKA_DIR /home/ec2-user/kafka
              cd /home/ec2-user/kafka/libs
              MVN=https://repo1.maven.org/maven2
              wget -q $MVN/io/strimzi/kafka-oauth-common/$STRIMZI_VERSION/kafka-oauth-common-$STRIMZI_VERSION.jar
              wget -q $MVN/io/strimzi/kafka-oauth-client/$STRIMZI_VERSION/kafka-oauth-client-$STRIMZI_VERSION.jar
              wget -q $MVN/com/nimbusds/nimbus-jose-jwt/$NIMBUS_VERSION/nimbus-jose-jwt-$NIMBUS_VERSION.jar

              # Clone the serverless pattern (Java apps + scripts + SAM template)
              cd /home/ec2-user
              git clone $SERVERLESS_LAND_GITHUB_LOCATION
              PATTERN_DIR=/home/ec2-user/serverless-patterns/kafka-lambda-oauth-java-sam

              # Build the producer/consumer JSON apps (shaded jar) and install scripts
              cd "$PATTERN_DIR/kafka_json_apps"
              mvn -q -DskipTests package || mvn -DskipTests package
              cp target/kafka-json-apps.jar "$KAFKA_JSON_APPS_JAR"
              mkdir -p /home/ec2-user/scripts
              cp "$PATTERN_DIR"/scripts/*.sh /home/ec2-user/scripts/
              chmod +x /home/ec2-user/scripts/*.sh

              # Export environment used by all helper scripts
              cat >> /home/ec2-user/.bash_profile <<EOF
              export AWS_REGION=$AWS_REGION
              export USER_POOL_ID=$USER_POOL_ID
              export APP_CLIENT_ID=$APP_CLIENT_ID
              export BOOTSTRAP_SERVERS=$BOOTSTRAP_SERVERS
              export KAFKA_TOPIC=$KAFKA_TOPIC
              export KAFKA_HOME=$KAFKA_HOME
              export KAFKA_JSON_APPS_JAR=$KAFKA_JSON_APPS_JAR
              export ADMIN_USERNAME=$ADMIN_USERNAME
              export PRODUCER_USERNAME=$PRODUCER_USERNAME
              export CONSUMER_USERNAME=$CONSUMER_USERNAME
              export ADMIN_SECRET_NAME=$ADMIN_SECRET_NAME
              export PRODUCER_SECRET_NAME=$PRODUCER_SECRET_NAME
              export CONSUMER_SECRET_NAME=$CONSUMER_SECRET_NAME
              EOF

              # Substitute the SAM template placeholders
              cd "$PATTERN_DIR"
              cp template_original.yaml template.yaml
              sed -i "s|BOOTSTRAP_SERVER_1|10.0.1.10:9092|g" template.yaml
              sed -i "s|BOOTSTRAP_SERVER_2|10.0.2.10:9092|g" template.yaml
              sed -i "s|BOOTSTRAP_SERVER_3|10.0.3.10:9092|g" template.yaml
              sed -i "s|SUBNET_1|$SUBNET1|g" template.yaml
              sed -i "s|SUBNET_2|$SUBNET2|g" template.yaml
              sed -i "s|SUBNET_3|$SUBNET3|g" template.yaml
              sed -i "s|LAMBDA_SG|$LAMBDA_SG|g" template.yaml
              sed -i "s|KAFKA_TOPIC|$KAFKA_TOPIC|g" template.yaml
              sed -i "s|JAVA_VERSION|$JAVA_VERSION|g" template.yaml

              # Set permanent passwords for the three Cognito role users from Secrets Manager
              set_password() {
                local username="$1" secret="$2" pw
                pw="$(aws secretsmanager get-secret-value --region "$AWS_REGION" --secret-id "$secret" --query SecretString --output text | jq -r .password)"
                aws cognito-idp admin-set-user-password --region "$AWS_REGION" --user-pool-id "$USER_POOL_ID" --username "$username" --password "$pw" --permanent
              }
              set_password "$ADMIN_USERNAME" "$ADMIN_SECRET_NAME"
              set_password "$PRODUCER_USERNAME" "$PRODUCER_SECRET_NAME"
              set_password "$CONSUMER_USERNAME" "$CONSUMER_SECRET_NAME"

              chown -R ec2-user:ec2-user /home/ec2-user

              # Wait for the brokers' SASL listeners to accept connections
              for i in $(seq 1 40); do
                if nc -z 10.0.1.10 9092 && nc -z 10.0.2.10 9092 && nc -z 10.0.3.10 9092; then
                  echo "brokers reachable"; break
                fi
                echo "waiting for brokers... ($i)"; sleep 15
              done

              # Bootstrap authorization: admin grants the consumer group-read ACL and
              # creates the default topic (with producer WRITE / consumer READ ACLs).
              bootstrap_acls() {
                local props
                props="$(sudo -u ec2-user bash /home/ec2-user/scripts/refresh_token.sh admin)" || return 1
                "$KAFKA_HOME"/bin/kafka-acls.sh --bootstrap-server "$BOOTSTRAP_SERVERS" --command-config "$props" \
                  --add --allow-principal "User:$CONSUMER_USERNAME" --operation Read --group '*' || return 1
                sudo -u ec2-user bash /home/ec2-user/scripts/admin_create_topic.sh "$KAFKA_TOPIC" 3 || return 1
              }
              for i in 1 2 3 4 5 6 7 8; do
                if bootstrap_acls > /home/ec2-user/bootstrap_acls_output.txt 2>&1; then
                  echo "ACL/topic bootstrap succeeded"; break
                fi
                echo "bootstrap attempt $i failed; retrying in 20s..."; sleep 20
              done
              chown -R ec2-user:ec2-user /home/ec2-user
            - java_version: !Ref JavaVersion
              region: !Ref 'AWS::Region'
              kafka_installer: !Ref ApacheKafkaInstallerLocation
              strimzi_version: !Ref StrimziOAuthVersion
              nimbus_version: !Ref NimbusJoseJwtVersion
              bootstrap_servers: !Sub
                - "${b1}:9092,${b2}:9092,${b3}:9092"
                - b1: !FindInMap ['BrokerConfig', 'Broker1', 'PrivateIp']
                  b2: !FindInMap ['BrokerConfig', 'Broker2', 'PrivateIp']
                  b3: !FindInMap ['BrokerConfig', 'Broker3', 'PrivateIp']
              kafka_topic: !Ref KafkaTopicForLambda
              user_pool_id: !Ref CognitoUserPool
              app_client_id: !Ref CognitoUserPoolClient
              admin_username: !Ref AdminUsername
              producer_username: !Ref ProducerUsername
              consumer_username: !Ref ConsumerUsername
              admin_secret: !Ref AdminUserSecret
              producer_secret: !Ref ProducerUserSecret
              consumer_secret: !Ref ConsumerUserSecret
              subnet1: !Ref PrivateSubnetOne
              subnet2: !Ref PrivateSubnetTwo
              subnet3: !Ref PrivateSubnetThree
              lambda_sg: !GetAtt KafkaBrokerSecurityGroup.GroupId
              serverless_land_github_location: !Ref ServerlessLandGithubLocation

  EC2InstanceEndpoint:
    Type: AWS::EC2::InstanceConnectEndpoint
    Properties:
      PreserveClientIp: true
      SecurityGroupIds:
        - !GetAtt KafkaClientInstanceSecurityGroup.GroupId
      SubnetId: !Ref PublicSubnetOne

Outputs:
  VPCId:
    Description: The ID of the VPC created
    Value: !Ref 'VPC'
    Export:
      Name: !Sub "${AWS::StackName}-VPCID"
  PrivateSubnetOne:
    Description: The ID of private subnet one
    Value: !Ref 'PrivateSubnetOne'
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnetOne"
  PrivateSubnetTwo:
    Description: The ID of private subnet two
    Value: !Ref 'PrivateSubnetTwo'
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnetTwo"
  PrivateSubnetThree:
    Description: The ID of private subnet three
    Value: !Ref 'PrivateSubnetThree'
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnetThree"
  KafkaBrokerSecurityGroupId:
    Description: Security group ID used by the Kafka brokers (also used for the Lambda ESM ENIs)
    Value: !GetAtt KafkaBrokerSecurityGroup.GroupId
    Export:
      Name: !Sub "${AWS::StackName}-KafkaBrokerSecurityGroupId"
  BootstrapServers:
    Description: Kafka bootstrap servers (broker private IP:port)
    Value: !Sub
      - "${b1}:9092,${b2}:9092,${b3}:9092"
      - b1: !FindInMap ['BrokerConfig', 'Broker1', 'PrivateIp']
        b2: !FindInMap ['BrokerConfig', 'Broker2', 'PrivateIp']
        b3: !FindInMap ['BrokerConfig', 'Broker3', 'PrivateIp']
    Export:
      Name: !Sub "${AWS::StackName}-BootstrapServers"
  CognitoUserPoolId:
    Description: Amazon Cognito User Pool ID (OAuth identity provider)
    Value: !Ref CognitoUserPool
    Export:
      Name: !Sub "${AWS::StackName}-CognitoUserPoolId"
  CognitoUserPoolClientId:
    Description: Amazon Cognito User Pool App Client ID
    Value: !Ref CognitoUserPoolClient
    Export:
      Name: !Sub "${AWS::StackName}-CognitoUserPoolClientId"
  KafkaTopicForLambda:
    Description: The Kafka topic the Lambda function will consume from
    Value: !Ref KafkaTopicForLambda
    Export:
      Name: !Sub "${AWS::StackName}-KafkaTopicForLambda"
  AdminUsername:
    Description: Cognito username of the Kafka admin (super user)
    Value: !Ref AdminUsername
  ProducerUsername:
    Description: Cognito username of the Kafka producer (WRITE only)
    Value: !Ref ProducerUsername
  ConsumerUsername:
    Description: Cognito username of the Kafka consumer (READ only)
    Value: !Ref ConsumerUsername
  AdminSecretArn:
    Description: Secrets Manager secret holding the admin user's generated password
    Value: !Ref AdminUserSecret
  ProducerSecretArn:
    Description: Secrets Manager secret holding the producer user's generated password
    Value: !Ref ProducerUserSecret
  ConsumerSecretArn:
    Description: Secrets Manager secret holding the consumer user's generated password
    Value: !Ref ConsumerUserSecret
  EC2InstanceEndpointID:
    Description: The ID of the EC2 Instance Connect Endpoint
    Value: !Ref EC2InstanceEndpoint
