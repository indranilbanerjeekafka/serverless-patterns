AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates a self-managed Apache Kafka cluster (3 brokers on 3 EC2 instances, KRaft mode)
  configured for SASL/OAUTHBEARER authentication against an Amazon Cognito User Pool,
  plus a 4th "client" EC2 instance pre-loaded with Java, Maven, Docker, the AWS CLI and
  the AWS SAM CLI so that the accompanying Lambda pattern can be built, deployed and tested.

Parameters:
  CognitoAdminUsername:
    Type: String
    Description: Username of the Cognito User Pool user that the Kafka client will authenticate as.
    Default: kafka-admin
    MinLength: 1
  CognitoAdminPassword:
    Type: String
    Description: >
      Password for the Cognito User Pool admin user. Must satisfy the pool password policy
      (minimum 8 characters, with upper case, lower case and a number).
    NoEcho: true
    MinLength: 8
  LatestAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64'
  JavaVersion:
    Type: String
    Description: Choose the version of Java for the Lambda function. Lambda supports Java 11, 17, 21 and 25.
    AllowedValues:
      - java11
      - java17
      - java21
      - java25
    Default: java21
  ApacheKafkaInstallerLocation:
    Type: String
    Description: Download URL for the Apache Kafka distribution (Scala 2.13 build).
    Default: https://archive.apache.org/dist/kafka/3.9.0/kafka_2.13-3.9.0.tgz
  StrimziOAuthVersion:
    Type: String
    Description: Version of the Strimzi kafka-oauth libraries used for SASL/OAUTHBEARER on the brokers and client.
    Default: 0.15.0
  NimbusJoseJwtVersion:
    Type: String
    Description: Version of the nimbus-jose-jwt library (transitive dependency of the Strimzi OAuth libraries).
    Default: 9.37.3
  KafkaClusterId:
    Type: String
    Description: >
      Shared KRaft cluster ID (base64-encoded UUID). Must be identical on all three brokers.
      Generate your own with 'kafka-storage.sh random-uuid' or keep the default.
    Default: 4L6g3nShT-eMCtK--X86sw
  KafkaTopicForLambda:
    Type: String
    Default: KafkaOAuthJavaLambdaTopic
  ServerlessLandGithubLocation:
    Type: String
    Default: https://github.com/aws-samples/serverless-patterns/

Mappings:
  SubnetConfig:
    VPC:
      CIDR: '10.0.0.0/16'
    PublicOne:
      CIDR: '10.0.0.0/24'
    PrivateSubnetOne:
      CIDR: '10.0.1.0/24'
    PrivateSubnetTwo:
      CIDR: '10.0.2.0/24'
    PrivateSubnetThree:
      CIDR: '10.0.3.0/24'
  BrokerConfig:
    Broker1:
      PrivateIp: '10.0.1.10'
      NodeId: '1'
    Broker2:
      PrivateIp: '10.0.2.10'
      NodeId: '2'
    Broker3:
      PrivateIp: '10.0.3.10'
      NodeId: '3'

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      EnableDnsSupport: true
      EnableDnsHostnames: true
      CidrBlock: !FindInMap ['SubnetConfig', 'VPC', 'CIDR']
      Tags:
        - Key: 'Name'
          Value: 'KafkaOAuthVPC'

  PublicSubnetOne:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs: {Ref: 'AWS::Region'}
      VpcId: !Ref 'VPC'
      CidrBlock: !FindInMap ['SubnetConfig', 'PublicOne', 'CIDR']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: 'Name'
          Value: 'PublicSubnet'
  PrivateSubnetOne:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs: {Ref: 'AWS::Region'}
      VpcId: !Ref 'VPC'
      CidrBlock: !FindInMap ['SubnetConfig', 'PrivateSubnetOne', 'CIDR']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: 'Name'
          Value: 'PrivateSubnetOne'
  PrivateSubnetTwo:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone:
        Fn::Select:
          - 1
          - Fn::GetAZs: {Ref: 'AWS::Region'}
      VpcId: !Ref 'VPC'
      CidrBlock: !FindInMap ['SubnetConfig', 'PrivateSubnetTwo', 'CIDR']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: 'Name'
          Value: 'PrivateSubnetTwo'
  PrivateSubnetThree:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone:
        Fn::Select:
          - 2
          - Fn::GetAZs: {Ref: 'AWS::Region'}
      VpcId: !Ref 'VPC'
      CidrBlock: !FindInMap ['SubnetConfig', 'PrivateSubnetThree', 'CIDR']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: 'Name'
          Value: 'PrivateSubnetThree'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachement:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref 'VPC'
      InternetGatewayId: !Ref 'InternetGateway'

  NATEIP:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachement
    Properties:
      Domain: vpc

  NATGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NATEIP.AllocationId
      SubnetId: !Ref 'PublicSubnetOne'
      Tags:
        - Key: 'Name'
          Value: 'KafkaOAuthNATGateway'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref 'VPC'
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachement
    Properties:
      RouteTableId: !Ref 'PublicRouteTable'
      DestinationCidrBlock: '0.0.0.0/0'
      GatewayId: !Ref 'InternetGateway'
  PublicSubnetOneRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetOne
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref 'VPC'
  PrivateRoute:
    Type: AWS::EC2::Route
    DependsOn: NATGateway
    Properties:
      RouteTableId: !Ref 'PrivateRouteTable'
      DestinationCidrBlock: '0.0.0.0/0'
      NatGatewayId: !Ref 'NATGateway'
  PrivateSubnetOneRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnetOne
  PrivateSubnetTwoRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnetTwo
  PrivateSubnetThreeRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnetThree

  # ---- Cognito User Pool used as the OAuth 2.0 identity provider ----
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-kafka-oauth-pool"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AWS::StackName}-kafka-client"
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 1
      TokenValidityUnits:
        AccessToken: hours

  CognitoAdminUser:
    Type: AWS::Cognito::UserPoolUser
    Properties:
      UserPoolId: !Ref CognitoUserPool
      Username: !Ref CognitoAdminUsername
      MessageAction: SUPPRESS

  # ---- Security Groups ----
  KafkaBrokerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the self-managed Kafka brokers
      GroupName: !Sub "${AWS::StackName}-kafka-broker-sg"
      VpcId: !Ref VPC
      SecurityGroupIngress:
        # Kafka client (9092), controller (9093) and inter-broker (9094) traffic
        # from anywhere inside the VPC (brokers, client instance and Lambda ENIs).
        - IpProtocol: tcp
          FromPort: 9092
          ToPort: 9094
          CidrIp: !FindInMap ['SubnetConfig', 'VPC', 'CIDR']
        # SSH from within the VPC (used by EC2 Instance Connect endpoint)
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !FindInMap ['SubnetConfig', 'VPC', 'CIDR']

  KafkaClientInstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the Kafka client / SAM deployment EC2 instance
      GroupName: !Sub "${AWS::StackName}-kafka-client-sg"
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !FindInMap ['SubnetConfig', 'VPC', 'CIDR']

  # ---- IAM role / instance profile for the EC2 instances ----
  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: 'sts:AssumeRole'
      Path: "/"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSCloudFormationFullAccess
        - arn:aws:iam::aws:policy/CloudWatchFullAccess
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/IAMFullAccess
        - arn:aws:iam::aws:policy/AWSLambda_FullAccess
        - arn:aws:iam::aws:policy/AmazonEC2FullAccess
      Policies:
        - PolicyName: CognitoAccess
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - 'cognito-idp:InitiateAuth'
                  - 'cognito-idp:AdminInitiateAuth'
                  - 'cognito-idp:AdminSetUserPassword'
                  - 'cognito-idp:AdminGetUser'
                  - 'cognito-idp:DescribeUserPool'
                  - 'cognito-idp:DescribeUserPoolClient'
                Resource: '*'

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Join ['-', ['EC2KafkaOAuthProfile', !Ref 'AWS::StackName']]
      Roles:
        - !Ref EC2Role

  # ---- Kafka broker EC2 instances (KRaft mode, SASL/OAUTHBEARER) ----
  KafkaBroker1:
    Type: AWS::EC2::Instance
    DependsOn: PrivateRoute
    Properties:
      InstanceType: m5.large
      IamInstanceProfile: !Ref EC2InstanceProfile
      SubnetId: !Ref PrivateSubnetOne
      PrivateIpAddress: !FindInMap ['BrokerConfig', 'Broker1', 'PrivateIp']
      SecurityGroupIds: [!GetAtt KafkaBrokerSecurityGroup.GroupId]
      ImageId: !Ref LatestAmiId
      Tags:
        - Key: 'Name'
          Value: 'KafkaBroker1'
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 50
            VolumeType: gp3
            DeleteOnTermination: true
      UserData:
        Fn::Base64:
          Fn::Sub:
            - |
              #!/bin/bash -xe
              exec > /var/log/kafka-broker-setup.log 2>&1

              NODE_ID=${node_id}
              BROKER_IP=${broker_ip}
              QUORUM_VOTERS=${quorum_voters}
              REGION=${region}
              USER_POOL_ID=${user_pool_id}
              KAFKA_URL=${kafka_installer}
              STRIMZI_VERSION=${strimzi_version}
              NIMBUS_VERSION=${nimbus_version}
              KAFKA_CLUSTER_ID=${kafka_cluster_id}

              install_pkg() {
                for i in 1 2 3 4 5; do
                  yum install -y "$@" && return 0
                  echo "yum install $* failed, retry $i"; sleep 5
                done
                return 1
              }
              yum update -y
              install_pkg java-17-amazon-corretto-headless wget tar

              cd /home/ec2-user
              KAFKA_TGZ=$(basename "$KAFKA_URL")
              KAFKA_DIR=$(basename "$KAFKA_TGZ" .tgz)
              for attempt in 1 2 3 4 5 6; do
                wget --timeout=60 --read-timeout=120 --tries=2 -O "$KAFKA_TGZ" "$KAFKA_URL" && test -s "$KAFKA_TGZ" && break
                echo "Kafka download attempt $attempt failed; retrying in 20s..."; sleep 20
              done
              test -s "$KAFKA_TGZ" || { echo "FATAL: unable to download Kafka from $KAFKA_URL"; exit 1; }
              tar -xzf "$KAFKA_TGZ"
              ln -sfn /home/ec2-user/$KAFKA_DIR /home/ec2-user/kafka

              cd /home/ec2-user/kafka/libs
              MVN=https://repo1.maven.org/maven2
              wget -q $MVN/io/strimzi/kafka-oauth-common/$STRIMZI_VERSION/kafka-oauth-common-$STRIMZI_VERSION.jar
              wget -q $MVN/io/strimzi/kafka-oauth-server/$STRIMZI_VERSION/kafka-oauth-server-$STRIMZI_VERSION.jar
              wget -q $MVN/io/strimzi/kafka-oauth-server-plain/$STRIMZI_VERSION/kafka-oauth-server-plain-$STRIMZI_VERSION.jar
              wget -q $MVN/io/strimzi/kafka-oauth-client/$STRIMZI_VERSION/kafka-oauth-client-$STRIMZI_VERSION.jar
              wget -q $MVN/com/nimbusds/nimbus-jose-jwt/$NIMBUS_VERSION/nimbus-jose-jwt-$NIMBUS_VERSION.jar

              ISSUER="https://cognito-idp.$REGION.amazonaws.com/$USER_POOL_ID"
              JWKS="$ISSUER/.well-known/jwks.json"

              cd /home/ec2-user/kafka
              cat > config/kraft-oauth.properties <<EOF
              process.roles=broker,controller
              node.id=$NODE_ID
              controller.quorum.voters=$QUORUM_VOTERS
              listeners=CLIENT://$BROKER_IP:9092,CONTROLLER://$BROKER_IP:9093,INTERNAL://$BROKER_IP:9094
              advertised.listeners=CLIENT://$BROKER_IP:9092,INTERNAL://$BROKER_IP:9094
              listener.security.protocol.map=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,CLIENT:SASL_PLAINTEXT
              controller.listener.names=CONTROLLER
              inter.broker.listener.name=INTERNAL
              sasl.enabled.mechanisms=OAUTHBEARER
              listener.name.client.sasl.enabled.mechanisms=OAUTHBEARER
              listener.name.client.oauthbearer.sasl.server.callback.handler.class=io.strimzi.kafka.oauth.server.JaasServerOauthValidatorCallbackHandler
              listener.name.client.oauthbearer.sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required oauth.jwks.endpoint.uri="$JWKS" oauth.valid.issuer.uri="$ISSUER" oauth.username.claim="username" unsecuredLoginStringClaim_sub="kafka-broker" ;
              num.partitions=3
              offsets.topic.replication.factor=3
              transaction.state.log.replication.factor=3
              transaction.state.log.min.isr=2
              default.replication.factor=3
              min.insync.replicas=2
              auto.create.topics.enable=true
              log.dirs=/home/ec2-user/kraft-combined-logs
              EOF

              /home/ec2-user/kafka/bin/kafka-storage.sh format -t "$KAFKA_CLUSTER_ID" -c /home/ec2-user/kafka/config/kraft-oauth.properties --ignore-formatted

              chown -R ec2-user:ec2-user /home/ec2-user

              cat > /etc/systemd/system/kafka.service <<EOF
              [Unit]
              Description=Apache Kafka (KRaft) broker
              After=network-online.target
              Wants=network-online.target
              [Service]
              Type=simple
              User=root
              Environment="KAFKA_HEAP_OPTS=-Xmx2G -Xms2G"
              ExecStart=/home/ec2-user/kafka/bin/kafka-server-start.sh /home/ec2-user/kafka/config/kraft-oauth.properties
              Restart=on-failure
              RestartSec=10
              [Install]
              WantedBy=multi-user.target
              EOF

              systemctl daemon-reload
              systemctl enable kafka
              systemctl start kafka
            - node_id: !FindInMap ['BrokerConfig', 'Broker1', 'NodeId']
              broker_ip: !FindInMap ['BrokerConfig', 'Broker1', 'PrivateIp']
              quorum_voters: !Sub
                - "1@${b1}:9093,2@${b2}:9093,3@${b3}:9093"
                - b1: !FindInMap ['BrokerConfig', 'Broker1', 'PrivateIp']
                  b2: !FindInMap ['BrokerConfig', 'Broker2', 'PrivateIp']
                  b3: !FindInMap ['BrokerConfig', 'Broker3', 'PrivateIp']
              region: !Ref 'AWS::Region'
              user_pool_id: !Ref CognitoUserPool
              kafka_installer: !Ref ApacheKafkaInstallerLocation
              strimzi_version: !Ref StrimziOAuthVersion
              nimbus_version: !Ref NimbusJoseJwtVersion
              kafka_cluster_id: !Ref KafkaClusterId

  KafkaBroker2:
    Type: AWS::EC2::Instance
    DependsOn: PrivateRoute
    Properties:
      InstanceType: m5.large
      IamInstanceProfile: !Ref EC2InstanceProfile
      SubnetId: !Ref PrivateSubnetTwo
      PrivateIpAddress: !FindInMap ['BrokerConfig', 'Broker2', 'PrivateIp']
      SecurityGroupIds: [!GetAtt KafkaBrokerSecurityGroup.GroupId]
      ImageId: !Ref LatestAmiId
      Tags:
        - Key: 'Name'
          Value: 'KafkaBroker2'
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 50
            VolumeType: gp3
            DeleteOnTermination: true
      UserData:
        Fn::Base64:
          Fn::Sub:
            - |
              #!/bin/bash -xe
              exec > /var/log/kafka-broker-setup.log 2>&1

              NODE_ID=${node_id}
              BROKER_IP=${broker_ip}
              QUORUM_VOTERS=${quorum_voters}
              REGION=${region}
              USER_POOL_ID=${user_pool_id}
              KAFKA_URL=${kafka_installer}
              STRIMZI_VERSION=${strimzi_version}
              NIMBUS_VERSION=${nimbus_version}
              KAFKA_CLUSTER_ID=${kafka_cluster_id}

              install_pkg() {
                for i in 1 2 3 4 5; do
                  yum install -y "$@" && return 0
                  echo "yum install $* failed, retry $i"; sleep 5
                done
                return 1
              }
              yum update -y
              install_pkg java-17-amazon-corretto-headless wget tar

              cd /home/ec2-user
              KAFKA_TGZ=$(basename "$KAFKA_URL")
              KAFKA_DIR=$(basename "$KAFKA_TGZ" .tgz)
              for attempt in 1 2 3 4 5 6; do
                wget --timeout=60 --read-timeout=120 --tries=2 -O "$KAFKA_TGZ" "$KAFKA_URL" && test -s "$KAFKA_TGZ" && break
                echo "Kafka download attempt $attempt failed; retrying in 20s..."; sleep 20
              done
              test -s "$KAFKA_TGZ" || { echo "FATAL: unable to download Kafka from $KAFKA_URL"; exit 1; }
              tar -xzf "$KAFKA_TGZ"
              ln -sfn /home/ec2-user/$KAFKA_DIR /home/ec2-user/kafka

              cd /home/ec2-user/kafka/libs
              MVN=https://repo1.maven.org/maven2
              wget -q $MVN/io/strimzi/kafka-oauth-common/$STRIMZI_VERSION/kafka-oauth-common-$STRIMZI_VERSION.jar
              wget -q $MVN/io/strimzi/kafka-oauth-server/$STRIMZI_VERSION/kafka-oauth-server-$STRIMZI_VERSION.jar
              wget -q $MVN/io/strimzi/kafka-oauth-server-plain/$STRIMZI_VERSION/kafka-oauth-server-plain-$STRIMZI_VERSION.jar
              wget -q $MVN/io/strimzi/kafka-oauth-client/$STRIMZI_VERSION/kafka-oauth-client-$STRIMZI_VERSION.jar
              wget -q $MVN/com/nimbusds/nimbus-jose-jwt/$NIMBUS_VERSION/nimbus-jose-jwt-$NIMBUS_VERSION.jar

              ISSUER="https://cognito-idp.$REGION.amazonaws.com/$USER_POOL_ID"
              JWKS="$ISSUER/.well-known/jwks.json"

              cd /home/ec2-user/kafka
              cat > config/kraft-oauth.properties <<EOF
              process.roles=broker,controller
              node.id=$NODE_ID
              controller.quorum.voters=$QUORUM_VOTERS
              listeners=CLIENT://$BROKER_IP:9092,CONTROLLER://$BROKER_IP:9093,INTERNAL://$BROKER_IP:9094
              advertised.listeners=CLIENT://$BROKER_IP:9092,INTERNAL://$BROKER_IP:9094
              listener.security.protocol.map=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,CLIENT:SASL_PLAINTEXT
              controller.listener.names=CONTROLLER
              inter.broker.listener.name=INTERNAL
              sasl.enabled.mechanisms=OAUTHBEARER
              listener.name.client.sasl.enabled.mechanisms=OAUTHBEARER
              listener.name.client.oauthbearer.sasl.server.callback.handler.class=io.strimzi.kafka.oauth.server.JaasServerOauthValidatorCallbackHandler
              listener.name.client.oauthbearer.sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required oauth.jwks.endpoint.uri="$JWKS" oauth.valid.issuer.uri="$ISSUER" oauth.username.claim="username" unsecuredLoginStringClaim_sub="kafka-broker" ;
              num.partitions=3
              offsets.topic.replication.factor=3
              transaction.state.log.replication.factor=3
              transaction.state.log.min.isr=2
              default.replication.factor=3
              min.insync.replicas=2
              auto.create.topics.enable=true
              log.dirs=/home/ec2-user/kraft-combined-logs
              EOF

              /home/ec2-user/kafka/bin/kafka-storage.sh format -t "$KAFKA_CLUSTER_ID" -c /home/ec2-user/kafka/config/kraft-oauth.properties --ignore-formatted

              chown -R ec2-user:ec2-user /home/ec2-user

              cat > /etc/systemd/system/kafka.service <<EOF
              [Unit]
              Description=Apache Kafka (KRaft) broker
              After=network-online.target
              Wants=network-online.target
