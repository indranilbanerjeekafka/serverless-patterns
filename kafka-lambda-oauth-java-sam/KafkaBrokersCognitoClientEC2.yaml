              Type=simple
              User=root
              Environment="KAFKA_HEAP_OPTS=-Xmx2G -Xms2G"
              ExecStart=/home/ec2-user/kafka/bin/kafka-server-start.sh /home/ec2-user/kafka/config/kraft-oauth.properties
              Restart=on-failure
              RestartSec=10
              [Install]
              WantedBy=multi-user.target
              EOF

              systemctl daemon-reload
              systemctl enable kafka
              systemctl start kafka
            - node_id: !FindInMap ['BrokerConfig', 'Broker2', 'NodeId']
              broker_ip: !FindInMap ['BrokerConfig', 'Broker2', 'PrivateIp']
              quorum_voters: !Sub
                - "1@${b1}:9093,2@${b2}:9093,3@${b3}:9093"
                - b1: !FindInMap ['BrokerConfig', 'Broker1', 'PrivateIp']
                  b2: !FindInMap ['BrokerConfig', 'Broker2', 'PrivateIp']
                  b3: !FindInMap ['BrokerConfig', 'Broker3', 'PrivateIp']
              region: !Ref 'AWS::Region'
              user_pool_id: !Ref CognitoUserPool
              kafka_installer: !Ref ApacheKafkaInstallerLocation
              strimzi_version: !Ref StrimziOAuthVersion
              nimbus_version: !Ref NimbusJoseJwtVersion
              kafka_cluster_id: !Ref KafkaClusterId

  KafkaBroker3:
    Type: AWS::EC2::Instance
    DependsOn: PrivateRoute
    Properties:
      InstanceType: m5.large
      IamInstanceProfile: !Ref EC2InstanceProfile
      SubnetId: !Ref PrivateSubnetThree
      PrivateIpAddress: !FindInMap ['BrokerConfig', 'Broker3', 'PrivateIp']
      SecurityGroupIds: [!GetAtt KafkaBrokerSecurityGroup.GroupId]
      ImageId: !Ref LatestAmiId
      Tags:
        - Key: 'Name'
          Value: 'KafkaBroker3'
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 50
            VolumeType: gp3
            DeleteOnTermination: true
      UserData:
        Fn::Base64:
          Fn::Sub:
            - |
              #!/bin/bash -xe
              exec > /var/log/kafka-broker-setup.log 2>&1

              NODE_ID=${node_id}
              BROKER_IP=${broker_ip}
              QUORUM_VOTERS=${quorum_voters}
              REGION=${region}
              USER_POOL_ID=${user_pool_id}
              KAFKA_URL=${kafka_installer}
              STRIMZI_VERSION=${strimzi_version}
              NIMBUS_VERSION=${nimbus_version}
              KAFKA_CLUSTER_ID=${kafka_cluster_id}

              install_pkg() {
                for i in 1 2 3 4 5; do
                  yum install -y "$@" && return 0
                  echo "yum install $* failed, retry $i"; sleep 5
                done
                return 1
              }
              yum update -y
              install_pkg java-17-amazon-corretto-headless wget tar

              cd /home/ec2-user
              KAFKA_TGZ=$(basename "$KAFKA_URL")
              KAFKA_DIR=$(basename "$KAFKA_TGZ" .tgz)
              for attempt in 1 2 3 4 5 6; do
                wget --timeout=60 --read-timeout=120 --tries=2 -O "$KAFKA_TGZ" "$KAFKA_URL" && test -s "$KAFKA_TGZ" && break
                echo "Kafka download attempt $attempt failed; retrying in 20s..."; sleep 20
              done
              test -s "$KAFKA_TGZ" || { echo "FATAL: unable to download Kafka from $KAFKA_URL"; exit 1; }
              tar -xzf "$KAFKA_TGZ"
              ln -sfn /home/ec2-user/$KAFKA_DIR /home/ec2-user/kafka

              cd /home/ec2-user/kafka/libs
              MVN=https://repo1.maven.org/maven2
              wget -q $MVN/io/strimzi/kafka-oauth-common/$STRIMZI_VERSION/kafka-oauth-common-$STRIMZI_VERSION.jar
              wget -q $MVN/io/strimzi/kafka-oauth-server/$STRIMZI_VERSION/kafka-oauth-server-$STRIMZI_VERSION.jar
              wget -q $MVN/io/strimzi/kafka-oauth-server-plain/$STRIMZI_VERSION/kafka-oauth-server-plain-$STRIMZI_VERSION.jar
              wget -q $MVN/io/strimzi/kafka-oauth-client/$STRIMZI_VERSION/kafka-oauth-client-$STRIMZI_VERSION.jar
              wget -q $MVN/com/nimbusds/nimbus-jose-jwt/$NIMBUS_VERSION/nimbus-jose-jwt-$NIMBUS_VERSION.jar

              ISSUER="https://cognito-idp.$REGION.amazonaws.com/$USER_POOL_ID"
              JWKS="$ISSUER/.well-known/jwks.json"

              cd /home/ec2-user/kafka
              cat > config/kraft-oauth.properties <<EOF
              process.roles=broker,controller
              node.id=$NODE_ID
              controller.quorum.voters=$QUORUM_VOTERS
              listeners=CLIENT://$BROKER_IP:9092,CONTROLLER://$BROKER_IP:9093,INTERNAL://$BROKER_IP:9094
              advertised.listeners=CLIENT://$BROKER_IP:9092,INTERNAL://$BROKER_IP:9094
              listener.security.protocol.map=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,CLIENT:SASL_PLAINTEXT
              controller.listener.names=CONTROLLER
              inter.broker.listener.name=INTERNAL
              sasl.enabled.mechanisms=OAUTHBEARER
              listener.name.client.sasl.enabled.mechanisms=OAUTHBEARER
              listener.name.client.oauthbearer.sasl.server.callback.handler.class=io.strimzi.kafka.oauth.server.JaasServerOauthValidatorCallbackHandler
              listener.name.client.oauthbearer.sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required oauth.jwks.endpoint.uri="$JWKS" oauth.valid.issuer.uri="$ISSUER" oauth.username.claim="username" unsecuredLoginStringClaim_sub="kafka-broker" ;
              num.partitions=3
              offsets.topic.replication.factor=3
              transaction.state.log.replication.factor=3
              transaction.state.log.min.isr=2
              default.replication.factor=3
              min.insync.replicas=2
              auto.create.topics.enable=true
              log.dirs=/home/ec2-user/kraft-combined-logs
              EOF

              /home/ec2-user/kafka/bin/kafka-storage.sh format -t "$KAFKA_CLUSTER_ID" -c /home/ec2-user/kafka/config/kraft-oauth.properties --ignore-formatted

              chown -R ec2-user:ec2-user /home/ec2-user

              cat > /etc/systemd/system/kafka.service <<EOF
              [Unit]
              Description=Apache Kafka (KRaft) broker
              After=network-online.target
              Wants=network-online.target
              [Service]
              Type=simple
              User=root
              Environment="KAFKA_HEAP_OPTS=-Xmx2G -Xms2G"
              ExecStart=/home/ec2-user/kafka/bin/kafka-server-start.sh /home/ec2-user/kafka/config/kraft-oauth.properties
              Restart=on-failure
              RestartSec=10
              [Install]
              WantedBy=multi-user.target
              EOF

              systemctl daemon-reload
              systemctl enable kafka
              systemctl start kafka
            - node_id: !FindInMap ['BrokerConfig', 'Broker3', 'NodeId']
              broker_ip: !FindInMap ['BrokerConfig', 'Broker3', 'PrivateIp']
              quorum_voters: !Sub
                - "1@${b1}:9093,2@${b2}:9093,3@${b3}:9093"
                - b1: !FindInMap ['BrokerConfig', 'Broker1', 'PrivateIp']
                  b2: !FindInMap ['BrokerConfig', 'Broker2', 'PrivateIp']
                  b3: !FindInMap ['BrokerConfig', 'Broker3', 'PrivateIp']
              region: !Ref 'AWS::Region'
              user_pool_id: !Ref CognitoUserPool
              kafka_installer: !Ref ApacheKafkaInstallerLocation
              strimzi_version: !Ref StrimziOAuthVersion
              nimbus_version: !Ref NimbusJoseJwtVersion
              kafka_cluster_id: !Ref KafkaClusterId

  KafkaClientEC2Instance:
    Type: AWS::EC2::Instance
    DependsOn: [KafkaBroker1, KafkaBroker2, KafkaBroker3, CognitoAdminUser]
    Properties:
      InstanceType: m5.large
      IamInstanceProfile: !Ref EC2InstanceProfile
      SubnetId: !Ref PublicSubnetOne
      SecurityGroupIds: [!GetAtt KafkaClientInstanceSecurityGroup.GroupId]
      ImageId: !Ref LatestAmiId
      Tags:
        - Key: 'Name'
          Value: 'KafkaClientInstance'
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 50
            VolumeType: gp3
            DeleteOnTermination: true
      UserData:
        Fn::Base64:
          Fn::Sub:
            - |
              #!/bin/bash -xe
              exec > /var/log/kafka-client-setup.log 2>&1

              JAVA_VERSION=${java_version}
              AWS_REGION=${region}
              KAFKA_URL=${kafka_installer}
              STRIMZI_VERSION=${strimzi_version}
              NIMBUS_VERSION=${nimbus_version}
              BOOTSTRAP_SERVERS=${bootstrap_servers}
              KAFKA_TOPIC=${kafka_topic}
              USER_POOL_ID=${user_pool_id}
              APP_CLIENT_ID=${app_client_id}
              COGNITO_USER=${cognito_user}
              COGNITO_PASSWORD='${cognito_password}'
              SUBNET1=${subnet1}
              SUBNET2=${subnet2}
              SUBNET3=${subnet3}
              LAMBDA_SG=${lambda_sg}
              SERVERLESS_LAND_GITHUB_LOCATION=${serverless_land_github_location}

              install_pkg() {
                for i in 1 2 3 4 5; do
                  yum install -y "$@" && return 0
                  echo "yum install $* failed, retry $i"; sleep 5
                done
                return 1
              }
              yum update -y

              case "$JAVA_VERSION" in
                java11) install_pkg java-11-amazon-corretto-devel ;;
                java17) install_pkg java-17-amazon-corretto-devel ;;
                java21) install_pkg java-21-amazon-corretto-devel ;;
                java25) install_pkg java-25-amazon-corretto-devel ;;
                *) install_pkg java-21-amazon-corretto-devel ;;
              esac
              install_pkg git jq nmap-ncat wget tar unzip
              yum erase awscli -y || true
              install_pkg docker
              service docker start
              usermod -a -G docker ec2-user

              wget -q https://repos.fedorapeople.org/repos/dchen/apache-maven/epel-apache-maven.repo -O /etc/yum.repos.d/epel-apache-maven.repo
              sed -i s/\$releasever/6/g /etc/yum.repos.d/epel-apache-maven.repo
              install_pkg apache-maven || yum install -y maven || true

              # AWS CLI v2
              cd /home/ec2-user
              curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
              unzip -q awscliv2.zip
              ./aws/install || ./aws/install --update

              # AWS SAM CLI
              cd /home/ec2-user
              mkdir -p awssam && cd awssam
              wget -q https://github.com/aws/aws-sam-cli/releases/latest/download/aws-sam-cli-linux-x86_64.zip
              unzip -q aws-sam-cli-linux-x86_64.zip -d sam-installation
              ./sam-installation/install || ./sam-installation/install --update

              # Kafka CLI tools + Strimzi client OAuth libraries
              cd /home/ec2-user
              KAFKA_TGZ=$(basename "$KAFKA_URL")
              KAFKA_DIR=$(basename "$KAFKA_TGZ" .tgz)
              for attempt in 1 2 3 4 5 6; do
                wget --timeout=60 --read-timeout=120 --tries=2 -O "$KAFKA_TGZ" "$KAFKA_URL" && test -s "$KAFKA_TGZ" && break
                echo "Kafka download attempt $attempt failed; retrying in 20s..."; sleep 20
              done
              test -s "$KAFKA_TGZ" || { echo "FATAL: unable to download Kafka from $KAFKA_URL"; exit 1; }
              tar -xzf "$KAFKA_TGZ"
              ln -sfn /home/ec2-user/$KAFKA_DIR /home/ec2-user/kafka
              cd /home/ec2-user/kafka/libs
              MVN=https://repo1.maven.org/maven2
              wget -q $MVN/io/strimzi/kafka-oauth-common/$STRIMZI_VERSION/kafka-oauth-common-$STRIMZI_VERSION.jar
              wget -q $MVN/io/strimzi/kafka-oauth-client/$STRIMZI_VERSION/kafka-oauth-client-$STRIMZI_VERSION.jar
              wget -q $MVN/com/nimbusds/nimbus-jose-jwt/$NIMBUS_VERSION/nimbus-jose-jwt-$NIMBUS_VERSION.jar

              cat >> /home/ec2-user/.bash_profile <<EOF
              export AWS_REGION=$AWS_REGION
              export USER_POOL_ID=$USER_POOL_ID
              export APP_CLIENT_ID=$APP_CLIENT_ID
              export COGNITO_USER=$COGNITO_USER
              export COGNITO_PASSWORD='$COGNITO_PASSWORD'
              export BOOTSTRAP_SERVERS=$BOOTSTRAP_SERVERS
              export KAFKA_TOPIC=$KAFKA_TOPIC
              EOF

              # Set a permanent password for the Cognito admin user
              aws cognito-idp admin-set-user-password --region "$AWS_REGION" --user-pool-id "$USER_POOL_ID" --username "$COGNITO_USER" --password "$COGNITO_PASSWORD" --permanent

              # Helper: fetch a fresh Cognito access token and (re)write client.properties
              cat > /home/ec2-user/refresh_token.sh <<'SCRIPT'
              #!/bin/bash
              source /home/ec2-user/.bash_profile
              TOKEN=$(aws cognito-idp initiate-auth --region "$AWS_REGION" --auth-flow USER_PASSWORD_AUTH --client-id "$APP_CLIENT_ID" --auth-parameters USERNAME="$COGNITO_USER",PASSWORD="$COGNITO_PASSWORD" --query 'AuthenticationResult.AccessToken' --output text)
              if [ -z "$TOKEN" ] || [ "$TOKEN" = "None" ]; then
                echo "ERROR: failed to obtain Cognito access token"; exit 1
              fi
              cat > /home/ec2-user/kafka/config/client.properties <<EOC
              security.protocol=SASL_PLAINTEXT
              sasl.mechanism=OAUTHBEARER
              sasl.login.callback.handler.class=io.strimzi.kafka.oauth.client.JaasClientOauthLoginCallbackHandler
              sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required oauth.access.token="$TOKEN" ;
              EOC
              echo "Wrote /home/ec2-user/kafka/config/client.properties with a fresh access token"
              SCRIPT
              chmod +x /home/ec2-user/refresh_token.sh

              cat > /home/ec2-user/kafka_topic_creator.sh <<'SCRIPT'
              #!/bin/bash
              source /home/ec2-user/.bash_profile
              /home/ec2-user/refresh_token.sh
              /home/ec2-user/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server "$BOOTSTRAP_SERVERS" --command-config /home/ec2-user/kafka/config/client.properties --replication-factor 3 --partitions 3 --topic "$KAFKA_TOPIC"
              /home/ec2-user/kafka/bin/kafka-topics.sh --list --bootstrap-server "$BOOTSTRAP_SERVERS" --command-config /home/ec2-user/kafka/config/client.properties
              SCRIPT
              chmod +x /home/ec2-user/kafka_topic_creator.sh

              cat > /home/ec2-user/kafka_message_sender.sh <<'SCRIPT'
              #!/bin/bash
              source /home/ec2-user/.bash_profile
              /home/ec2-user/refresh_token.sh
              /home/ec2-user/kafka/bin/kafka-console-producer.sh --bootstrap-server "$BOOTSTRAP_SERVERS" --producer.config /home/ec2-user/kafka/config/client.properties --topic "$KAFKA_TOPIC"
              SCRIPT
              chmod +x /home/ec2-user/kafka_message_sender.sh

              # Wait for the brokers to come up, then create the topic
              for i in $(seq 1 30); do
                if nc -z 10.0.1.10 9092 && nc -z 10.0.2.10 9092 && nc -z 10.0.3.10 9092; then
                  echo "brokers reachable"; break
                fi
                echo "waiting for brokers... ($i)"; sleep 20
              done

              # Checkout the serverless pattern and substitute the SAM template placeholders
              cd /home/ec2-user
              git clone $SERVERLESS_LAND_GITHUB_LOCATION
              cd ./serverless-patterns/kafka-lambda-oauth-java-sam
              cp template_original.yaml template.yaml
              sed -i "s|BOOTSTRAP_SERVER_1|10.0.1.10:9092|g" template.yaml
              sed -i "s|BOOTSTRAP_SERVER_2|10.0.2.10:9092|g" template.yaml
              sed -i "s|BOOTSTRAP_SERVER_3|10.0.3.10:9092|g" template.yaml
              sed -i "s|SUBNET_1|$SUBNET1|g" template.yaml
              sed -i "s|SUBNET_2|$SUBNET2|g" template.yaml
              sed -i "s|SUBNET_3|$SUBNET3|g" template.yaml
              sed -i "s|LAMBDA_SG|$LAMBDA_SG|g" template.yaml
              sed -i "s|KAFKA_TOPIC|$KAFKA_TOPIC|g" template.yaml
              sed -i "s|JAVA_VERSION|$JAVA_VERSION|g" template.yaml

              chown -R ec2-user:ec2-user /home/ec2-user
              sudo -u ec2-user bash /home/ec2-user/kafka_topic_creator.sh > /home/ec2-user/kafka_topic_creator_output.txt 2>&1 || true
            - java_version: !Ref JavaVersion
              region: !Ref 'AWS::Region'
              kafka_installer: !Ref ApacheKafkaInstallerLocation
              strimzi_version: !Ref StrimziOAuthVersion
              nimbus_version: !Ref NimbusJoseJwtVersion
              bootstrap_servers: !Sub
                - "${b1}:9092,${b2}:9092,${b3}:9092"
                - b1: !FindInMap ['BrokerConfig', 'Broker1', 'PrivateIp']
                  b2: !FindInMap ['BrokerConfig', 'Broker2', 'PrivateIp']
                  b3: !FindInMap ['BrokerConfig', 'Broker3', 'PrivateIp']
              kafka_topic: !Ref KafkaTopicForLambda
              user_pool_id: !Ref CognitoUserPool
              app_client_id: !Ref CognitoUserPoolClient
              cognito_user: !Ref CognitoAdminUsername
              cognito_password: !Ref CognitoAdminPassword
              subnet1: !Ref PrivateSubnetOne
              subnet2: !Ref PrivateSubnetTwo
              subnet3: !Ref PrivateSubnetThree
              lambda_sg: !GetAtt KafkaBrokerSecurityGroup.GroupId
              serverless_land_github_location: !Ref ServerlessLandGithubLocation

  EC2InstanceEndpoint:
    Type: AWS::EC2::InstanceConnectEndpoint
    Properties:
      PreserveClientIp: true
      SecurityGroupIds:
        - !GetAtt KafkaClientInstanceSecurityGroup.GroupId
      SubnetId: !Ref PublicSubnetOne

Outputs:
  VPCId:
    Description: The ID of the VPC created
    Value: !Ref 'VPC'
    Export:
      Name: !Sub "${AWS::StackName}-VPCID"
  PrivateSubnetOne:
    Description: The ID of private subnet one
    Value: !Ref 'PrivateSubnetOne'
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnetOne"
  PrivateSubnetTwo:
    Description: The ID of private subnet two
    Value: !Ref 'PrivateSubnetTwo'
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnetTwo"
  PrivateSubnetThree:
    Description: The ID of private subnet three
    Value: !Ref 'PrivateSubnetThree'
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnetThree"
  KafkaBrokerSecurityGroupId:
    Description: Security group ID used by the Kafka brokers (also used for the Lambda ESM ENIs)
    Value: !GetAtt KafkaBrokerSecurityGroup.GroupId
    Export:
      Name: !Sub "${AWS::StackName}-KafkaBrokerSecurityGroupId"
  BootstrapServers:
    Description: Kafka bootstrap servers (broker private IP:port)
    Value: !Sub
      - "${b1}:9092,${b2}:9092,${b3}:9092"
      - b1: !FindInMap ['BrokerConfig', 'Broker1', 'PrivateIp']
        b2: !FindInMap ['BrokerConfig', 'Broker2', 'PrivateIp']
        b3: !FindInMap ['BrokerConfig', 'Broker3', 'PrivateIp']
    Export:
      Name: !Sub "${AWS::StackName}-BootstrapServers"
  CognitoUserPoolId:
    Description: Amazon Cognito User Pool ID (OAuth identity provider)
    Value: !Ref CognitoUserPool
    Export:
      Name: !Sub "${AWS::StackName}-CognitoUserPoolId"
  CognitoUserPoolClientId:
    Description: Amazon Cognito User Pool App Client ID
    Value: !Ref CognitoUserPoolClient
    Export:
      Name: !Sub "${AWS::StackName}-CognitoUserPoolClientId"
  KafkaTopicForLambda:
    Description: The Kafka topic the Lambda function will consume from
    Value: !Ref KafkaTopicForLambda
    Export:
      Name: !Sub "${AWS::StackName}-KafkaTopicForLambda"
  EC2InstanceEndpointID:
    Description: The ID of the EC2 Instance Connect Endpoint
    Value: !Ref EC2InstanceEndpoint
